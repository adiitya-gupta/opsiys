[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# 301 Permanent Redirect from non-www (opsiys.in) to www.opsiys.in preserving path
[[redirects]]
  from = "https://opsiys.in/*"
  to = "https://www.opsiys.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://opsiys.in/*"
  to = "https://www.opsiys.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# Serve the React app for direct visits and refreshes on client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
