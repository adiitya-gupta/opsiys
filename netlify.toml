[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# Serve the React app for direct visits and refreshes on client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
