<!doctype html>
<html lang="en">
  <head>

    <!-- Performance Preconnect & Preload Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link rel="modulepreload" href="/src/main.tsx" />

    <link rel="icon" type="image/png" sizes="32x32" href="/logos/opsiyslogo.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logos/opsiyslogo.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logos/opsiyslogo.png" />

    <!-- Canonical URL -->

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://opsiys.in/" />
    <meta property="og:title" content="Opsiys | Business Growth Partner for Digital Growth" />

    <meta name="twitter:image" content="https://opsiys.in/logos/opsiyslogo.png" />

    <!-- JSON-LD Structured Data for Google Search Favicon & Logo -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "OPSIYS",
      "url": "https://opsiys.in/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://opsiys.in/logos/opsiyslogo.png",

        "height": 512

        "name": "Aditya Gupta",
        "jobTitle": "Founder & Chief Executive Officer"
      },
      "sameAs": [
        "https://github.com/adiitya-gupta/opsiys",
        "https://x.com/Opsiys",
        "https://www.instagram.com/opsiys/",
        "https://www.linkedin.com/company/opsiys/"
      ]
    }
    </script>

  <body class="bg-white text-[#0B0B0B] antialiased">
